name: Publish desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Regression gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GTK build dependency
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:sdd
      - run: cargo test
        working-directory: src-tauri
      - run: node scripts/verify-release-version.mjs "${{ inputs.tag || github.ref_name }}"

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            bundles: dmg
            arch: aarch64
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
            arch: x64
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Create verified release asset metadata
        shell: bash
        run: node scripts/create-release-asset.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "${{ inputs.tag || github.ref_name }}" --input src-tauri/target/release/bundle --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create release metadata and checksum manifest
        run: node scripts/merge-release-metadata.mjs --input release-assets --output release-assets --version "${{ inputs.tag || github.ref_name }}" --baseUrl "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}"
      - name: Publish immutable release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
